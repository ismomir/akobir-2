<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotelo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="header-inner">
            <!-- Логотип слева -->
            
                <img src="logo.png" alt="Hotelo logo" class="logo-img">
            

            <!-- Навигация, иконка меню и кнопка справа -->
            <div class="header-right">
                <div class="nav-menu">
                    <p>Booking</p>
                    <p>Facilities</p>
                    <p>About Us</p>
                    <p>Location</p>
                    <p>Contact</p>
                </div>

                <img src="menu.png" alt="menu" class="burger-btn">

                <p class="sign-in-btn">Sign In</p>
        </div>
    </div>
    <!-- +++++++++++++++++++++++++++++++ -->

    <div class="hero-section">
        <!-- Верхняя часть: заголовок слева и поиск справа -->
        <div class="hero-top">
            <div class="hero-text">
                <h1>Find Your Best Hotel<br>for Deals</h1>
                <p class="hero-desc">
                    Lorem Ipsum is simply dummy text of the printing<br>
                    and typesetting industry.
                </p>
            </div>

            <!-- Панель поиска -->
            <div class="search-box">
                <div class="search-row">
                    <div class="search-field">
                        <img src="calendar 1.png" alt="Calendar" class="field-icon">
                        <span>Jun 10 - 14</span>
                    </div>
                    <div class="search-field">
                        <img src="person 1.png" alt="Guests" class="field-icon">
                        <span>2 Guests</span>
                    </div>
                </div>

                <div class="search-row search-bottom-row">
                    <div class="search-location">
                        <img src="pin 1.png" alt="Location" class="field-icon">
                        <span>United States</span>
                    </div>
                    <div class="search-btn">
                        <img src="search-outline 1.png" alt="Search" class="search-icon">
                    </div>
                </div>
            </div>
        </div>

        <!-- Нижняя часть: галерея фотографий -->
        <div class="gallery-grid">
            <!-- Большая картинка слева с подписью -->
            <div class="gallery-main">
                <img src="dacha.png" alt="Wagstaffe NSW, Australia" class="img-main">
                <p class="gallery-caption">Wagstaffe NSW, Australia</p>
            </div>

            <!-- Две картинки справа друг под другом -->
            <div class="gallery-side">
                <img src="dacha2.png" alt="Pool area" class="img-side">
                <img src="dacha3.png" alt="Hotel room" class="img-side">
            </div>
        </div>
    </div>

</body>
</html>
